<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Build photos-data.js</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
  #log { white-space: pre-wrap; font: .85rem/1.5 monospace; margin-top: 16px; }
  #dl { display: none; margin-top: 16px; padding: 10px 18px; background: #0b8a52; color: #fff; border-radius: 8px; text-decoration: none; }
</style>
</head>
<body>
<h2>Build photos-data.js</h2>
<p>Choose your <b>photos/faculty</b> folder. When it says Done, download the file and put it next to <b>faculty.html</b>.</p>
<input type="file" id="pick" webkitdirectory multiple>
<div id="log"></div>
<a id="dl" download="photos-data.js">Download photos-data.js</a>
<script>
const log = document.getElementById('log');
const dl = document.getElementById('dl');
const MAX = 720;

document.getElementById('pick').addEventListener('change', async e => {
  const files = [...e.target.files].filter(f => /\.(png|jpe?g|webp)$/i.test(f.name));
  const out = {};
  log.textContent = '';
  dl.style.display = 'none';

  for (const f of files) {
    try {
      const bmp = await createImageBitmap(f);
      const s = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * s);
      c.height = Math.round(bmp.height * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1f7a4d';              // fills any transparent area with the card green
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bmp, 0, 0, c.width, c.height);
      out['photos/faculty/' + f.name] = c.toDataURL('image/jpeg', 0.85);
      log.textContent += 'OK    ' + f.name + '\n';
    } catch (err) {
      log.textContent += 'FAIL  ' + f.name + '\n';
    }
  }

  const js = '/* Generated by build-photos.html */\nwindow.FACULTY_PHOTOS = ' + JSON.stringify(out) + ';\n';
  dl.href = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
  dl.style.display = 'inline-block';
  log.textContent += '\nDone: ' + Object.keys(out).length + ' photos.';
});
</script>
</body>
</html>
